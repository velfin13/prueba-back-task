
services:
  db:
    container_name: mysql
    image: mysql:5.7
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: velkin
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: task_manager
    networks:
      - internal

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:latest
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
    networks:
      - internal
  task-ui:
    container_name: task-ui
    image: velfin13/task-ui:2.0.0
    ports:
      - "5173:80"
    networks:
      - internal

  backend:
    container_name: task-backend
    image: velfin13/task-backend:2.0.0
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - internal
    command: sh -c "sleep 10 && npm run dev"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: task_manager
      DB_USER: velkin
      DB_PASSWORD: password
      JWT_SECRET: supersecreto
      FRONTEND_URL: http://localhost:5173
  

networks:
  internal:
    driver: bridge
